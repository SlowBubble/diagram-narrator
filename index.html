<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram Narrator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="app">
    <style>
      .menu-icon {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 30px;
        height: 20px;
        cursor: pointer;
        transition: transform 0.2s;
      }

      .menu-icon:hover {
        transform: scale(1.1);
      }

      .menu-icon span {
        display: block;
        height: 3px;
        width: 100%;
        background-color: #000;
        border-radius: 3px;
      }
    </style>
    <div style="position: fixed; top: 30px; right: 30px; z-index: 100;">
      <a href="storage.html" title="Storage" aria-label="Storage">
        <div class="menu-icon">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </a>
    </div>
    <canvas id="diagram-canvas"></canvas>
  </div>
  <script type="module" src="main.js"></script>
</body>

</html>
