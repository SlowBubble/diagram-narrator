<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Creator - Diagram Narrator</title>
  <meta name="description"
    content="Generate and edit stories with syllable breakdown and pronunciation guides using AI.">
  <link rel="stylesheet" href="editStory.css">
</head>

<body>
  <header>
    <h1>Story Creator</h1>
    <div id="auth-status" class="text-dim text-sm"></div>
  </header>

  <main>
    <section class="input-section">
      <textarea id="story-prompt"
        placeholder="Enter a story prompt or topic (e.g., 'A story about a brave cat named Max who finds a lost kitten')..."
        autofocus></textarea>
      <div class="input-controls">
        <div class="control-group">
          <label for="sentence-count" class="text-xs text-dim">Number of sentences:</label>
          <input type="number" id="sentence-count" min="1" max="20" value="6">
        </div>
        <div class="text-dim text-xs">
          Press <kbd>Enter</kbd> to generate. Use <kbd>Shift + Enter</kbd> for new lines.
        </div>
      </div>
    </section>

    <section class="output-section">
      <div class="output-header">
        <span class="output-label">Generated JSON</span>
        <span id="status-message" class="text-xs text-dim"></span>
      </div>
      <textarea id="json-display" spellcheck="false"></textarea>
      <div class="text-dim text-xs" style="margin-top: 0.5rem;">
        Press <kbd>Cmd + S</kbd> to save changes.
      </div>
    </section>
  </main>

  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Generating Story...</div>
  </div>

  <script type="module" src="editStory.js"></script>
</body>

</html>
