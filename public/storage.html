<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram Storage</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      overflow: auto;
      height: auto;
      min-height: 100vh;
      display: block;
      padding: 40px;
    }

    #app {
      display: block;
      max-width: 1000px;
      margin: 0 auto;
      text-align: left;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .table-container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      border: 1px solid #f0f0f0;
      overflow: hidden;
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }

    th {
      background: #f8f9fa;
      padding: 16px 24px;
      text-align: left;
      font-weight: 600;
      color: #666;
      border-bottom: 2px solid #eee;
    }

    td {
      padding: 16px 24px;
      border-bottom: 1px solid #eee;
      color: #333;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #fcfcfc;
    }

    .diagram-id {
      font-weight: 600;
      color: #000;
    }

    .date-cell {
      color: #888;
      font-size: 14px;
    }

    .actions-cell {
      text-align: right;
    }

    .btn {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s;
      font-size: 14px;
    }

    .btn-primary {
      background: #000;
      color: #fff;
    }

    .btn-primary:hover {
      background: #333;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
      margin-right: 8px;
    }

    .btn-secondary:hover {
      background: #e5e5e5;
    }

    .empty-state {
      padding: 60px;
      text-align: center;
      color: #999;
      font-size: 18px;
    }

    .nav {
      margin-bottom: 40px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .nav a {
      color: #666;
      text-decoration: none;
      font-weight: 500;
    }

    .nav a:hover {
      color: #000;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="nav">
      <a href="index.html">← Back to Viewer</a>
      <a href="index.html?canto=1">Canto Viewer</a>
      <a href="edit.html" id="new-diagram-link" style="display: none;">New Diagram</a>
      <a href="#" id="signin-link" style="display: none;">Sign In</a>
      <div id="auth-status" style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
        <span id="user-name" style="color: #666; font-size: 14px;"></span>
        <a href="#" id="signout-link" style="display: none; font-size: 14px; color: #ff4444;">Sign Out</a>
      </div>
    </div>

    <h1>My Diagrams</h1>
    <p style="color: #666;">View and manage your cloud saved diagrams.</p>

    <div class="table-container">
      <table id="storage-table" style="display: none;">
        <thead>
          <tr>
            <th>Diagram Name / ID</th>
            <th>Last Edited</th>
            <th class="actions-cell">Actions</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Loaded via JS -->
        </tbody>
      </table>
      <div id="empty-state" class="empty-state">
        Loading...
      </div>
    </div>
  </div>

  <script type="module">
    import { db, auth, googleProvider } from './firebase-config.js';
    import { collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { onAuthStateChanged, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const newDiagramLink = document.getElementById('new-diagram-link');
    const signinLink = document.getElementById('signin-link');
    const signoutLink = document.getElementById('signout-link');
    const userNameSpan = document.getElementById('user-name');

    // Handle Auth State Changes
    onAuthStateChanged(auth, (user) => {
      if (user) {
        newDiagramLink.style.display = 'inline';
        signinLink.style.display = 'none';
        signoutLink.style.display = 'inline';
        userNameSpan.textContent = user.displayName;
        renderTable();
      } else {
        newDiagramLink.style.display = 'none';
        signinLink.style.display = 'inline';
        signoutLink.style.display = 'none';
        userNameSpan.textContent = '';
        // Clear table when signed out
        document.getElementById('table-body').innerHTML = '';
        document.getElementById('storage-table').style.display = 'none';
        document.getElementById('empty-state').style.display = 'block';
        document.getElementById('empty-state').textContent = 'Please sign in to view your diagrams.';
      }
    });

    // Sign In Function
    signinLink.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        console.error("Sign-in error:", error);
        alert("Failed to sign in. Please try again.");
      }
    });

    // Sign Out Function
    signoutLink.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Sign-out error:", error);
      }
    });

    async function loadCloudDiagrams() {
      const diagrams = [];
      try {
        const querySnapshot = await getDocs(collection(db, "diagrams"));
        querySnapshot.forEach((doc) => {
          const data = doc.data();

          if (data.diagram && data.info) {
            // Only show diagrams owned by the current user
            if (data.info.owner === auth.currentUser.uid) {
              diagrams.push({
                ...data.diagram,
                diagramId: data.info.id,
                lastEdited: data.info.lastEdited,
                isPublic: data.info.isPublic
              });
            }
          } else {
            // Fallback for old format (assume it's the user's if they are the only one using it so far)
            if (data && data.diagramId && data.lastEdited !== undefined) {
              diagrams.push(data);
            }
          }
        });
      } catch (e) {
        console.error("Error loading diagrams from Firestore:", e);
      }
      return diagrams.sort((a, b) => b.lastEdited - a.lastEdited);
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleString(undefined, {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    window.deleteDiagram = async function (id) {
      if (!auth.currentUser) {
        alert("You must be signed in to delete diagrams.");
        return;
      }
      if (confirm('Are you sure you want to delete this diagram from cloud storage?')) {
        try {
          await deleteDoc(doc(db, "diagrams", id));
          renderTable();
        } catch (e) {
          console.error("Error deleting diagram:", e);
          alert("Failed to delete diagram.");
        }
      }
    }

    async function renderTable() {
      if (!auth.currentUser) return;

      const diagrams = await loadCloudDiagrams();
      const tableBody = document.getElementById('table-body');
      const table = document.getElementById('storage-table');
      const emptyState = document.getElementById('empty-state');

      if (diagrams.length === 0) {
        table.style.display = 'none';
        emptyState.style.display = 'block';
        emptyState.textContent = 'No diagrams found.';
        return;
      }

      table.style.display = 'table';
      emptyState.style.display = 'none';
      tableBody.innerHTML = '';

      diagrams.forEach(diagram => {
        const tr = document.createElement('tr');

        // Use the first node's text or the ID as a display name if available
        let displayName = diagram.diagramId;
        if (diagram.nodes && diagram.nodes.length > 0) {
          const firstNode = diagram.nodes.find(n => n.text);
          if (firstNode) {
            displayName = firstNode.text.split('\n')[0];
          }
        }

        tr.innerHTML = `
          <td>
            <a href="edit.html?id=${diagram.diagramId}" style="text-decoration: none; color: inherit; display: block;">
              <div class="diagram-id">
                ${displayName}
                ${diagram.isPublic ? '<span style="font-size: 10px; background: #e6fffa; color: #38b2ac; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle;">Public</span>' : ''}
              </div>
              <div style="font-size: 12px; color: #aaa;">${diagram.diagramId}</div>
            </a>
          </td>
          <td class="date-cell">${formatDate(diagram.lastEdited)}</td>
          <td class="actions-cell">
            <button onclick="deleteDiagram('${diagram.diagramId}')" class="btn" style="color: #ff4444; background: #fff5f5; border: 1px solid #ffebeb; cursor: pointer;">Delete</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });
    }
  </script>
</body>

</html>
